<!DOCTYPE html>
<html lang="en">
<head>

<title>Family Sportsbook</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'DM Sans', -apple-system, Helvetica, Arial, sans-serif;
    margin: 0;
    color: #eef0f5;
    background:
      radial-gradient(circle at 15% -10%, rgba(139,92,246,0.12) 0%, transparent 40%),
      radial-gradient(circle at 100% 10%, rgba(245,197,66,0.10) 0%, transparent 35%),
      radial-gradient(circle at 20% 0%, #1c2a24 0%, #0b0f0d 45%, #07090a 100%);

  }

    padding: 10px 16px;

  button:active { transform: scale(0.95); }
  button:disabled { opacity: 0.4; cursor: default; }
  input {
    padding: 9px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15);
    font-size: 14px; background: rgba(255,255,255,0.05); color: #fff; outline: none;
  }
  input:focus { border-color: #48db8d; box-shadow: 0 0 0 3px rgba(72,219,141,0.15); }
  .muted { color: #8b9a90; font-size: 13px; }

  .loss { color: #f87171; }
  .gold { color: #f5c542; }
  .tab-panel { animation: fadeIn 0.3s ease; }
  .balance { display: inline-block; font-family: 'Space Grotesk', sans-serif; letter-spacing: -0.5px; }
  .pulse-win { animation: pulseWin 0.7s ease; }
  .pulse-loss { animation: pulseLoss 0.7s ease; }
  @keyframes pulseWin { 0% { color: #4ade80; transform: scale(1.18); text-shadow: 0 0 24px rgba(74,222,128,0.8);} 100% { color: inherit; transform: scale(1); text-shadow: none; } }
  @keyframes pulseLoss { 0% { color: #f87171; transform: scale(1.08); text-shadow: 0 0 18px rgba(248,113,113,0.7);} 100% { color: inherit; transform: scale(1); text-shadow: none; } }

  .hero {
    background: linear-gradient(135deg, #16261d 0%, #0c1712 100%);
    border: 1px solid rgba(245, 197, 66, 0.2);
    border-radius: 18px;
    padding: 16px 20px;
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 2rem);
    max-width: 480px;
    z-index: 50;
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.55);
  }
  .hero-spacer { height: 92px; }
  .body-hero-fix { }

  .felt { background: radial-gradient(ellipse at 50% 0%, #1a3324 0%, #0e1f15 70%); border: 1px solid rgba(72,219,141,0.2); }

  .coin { width: 76px; height: 76px; border-radius: 50%; background: radial-gradient(circle at 32% 28%, #fff3c4, #f5c542 55%, #a97e12); display: flex; align-items: center; justify-content: center; font-weight: 700; font-family: 'Space Grotesk'; color: #5c4300; margin: 16px auto; box-shadow: 0 0 30px rgba(245,197,66,0.45), inset 0 -6px 10px rgba(0,0,0,0.25), inset 0 4px 8px rgba(255,255,255,0.4); font-size: 24px; border: 3px solid #d9a72c; }
  .coin-flip { animation: flip 0.8s ease; }
  @keyframes flip { 0% { transform: rotateY(0); } 50% { transform: rotateY(900deg) scale(1.15); } 100% { transform: rotateY(1800deg); } }

  .slot-machine { background: linear-gradient(180deg, #3a1f1f, #1c0f0f); border-radius: 16px; padding: 18px 16px 22px; border: 2px solid #5c2b2b; box-shadow: inset 0 0 20px rgba(0,0,0,0.6), 0 0 20px rgba(184,60,60,0.15); position: relative; }
  .slot-window { background: #0a0a0a; border-radius: 10px; padding: 12px; display: flex; justify-content: center; gap: 8px; border: 3px solid #f5c542; box-shadow: inset 0 4px 10px rgba(0,0,0,0.8); }
  .reel { display: inline-block; width: 56px; height: 56px; line-height: 56px; text-align: center; font-size: 32px; border-radius: 8px; background: linear-gradient(180deg, #232320, #101010); box-shadow: inset 0 0 10px rgba(0,0,0,0.7); }
  .reel-spin { animation: spin 0.5s ease; }
  @keyframes spin { 0% { transform: translateY(-24px) scale(0.75); opacity: 0.15; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
  .lever { position: absolute; right: -14px; top: 24px; width: 10px; height: 60px; background: linear-gradient(90deg, #888, #ccc, #888); border-radius: 6px; transform-origin: bottom center; transition: transform 0.15s ease; }
  .lever::after { content: ''; position: absolute; top: -14px; left: -7px; width: 24px; height: 24px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ff6b6b, #a02020); box-shadow: 0 0 10px rgba(255,80,80,0.5); }
  .lever-pull { animation: leverPull 0.5s ease; }
  @keyframes leverPull { 0% { transform: rotate(0deg); } 40% { transform: rotate(35deg); } 100% { transform: rotate(0deg); } }

  .wheel-wrap { position: relative; width: 130px; height: 130px; margin: 16px auto; }
  .wheel {
    width: 130px; height: 130px; border-radius: 50%; border: 6px solid #caa53a;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 30px rgba(245,197,66,0.3), inset 0 0 12px rgba(0,0,0,0.6);
    background: conic-gradient(
      #111 0deg 9.7deg, #b23b3b 9.7deg 19.4deg, #111 19.4deg 29.1deg, #b23b3b 29.1deg 38.8deg,
      #111 38.8deg 48.5deg, #b23b3b 48.5deg 58.2deg, #111 58.2deg 67.9deg, #b23b3b 67.9deg 77.6deg,
      #111 77.6deg 87.3deg, #1a7f4e 87.3deg 97deg, #b23b3b 97deg 106.7deg, #111 106.7deg 116.4deg,
      #b23b3b 116.4deg 126.1deg, #111 126.1deg 135.8deg, #b23b3b 135.8deg 145.5deg, #111 145.5deg 155.2deg,
      #b23b3b 155.2deg 164.9deg, #111 164.9deg 174.6deg, #b23b3b 174.6deg 184.3deg, #111 184.3deg 194deg,
      #b23b3b 194deg 203.7deg, #111 203.7deg 213.4deg, #b23b3b 213.4deg 223.1deg, #111 223.1deg 232.8deg,
      #b23b3b 232.8deg 242.5deg, #111 242.5deg 252.2deg, #b23b3b 252.2deg 261.9deg, #111 261.9deg 271.6deg,
      #b23b3b 271.6deg 281.3deg, #111 281.3deg 291deg, #b23b3b 291deg 300.7deg, #111 300.7deg 310.4deg,
      #b23b3b 310.4deg 320.1deg, #111 320.1deg 329.8deg, #b23b3b 329.8deg 339.5deg, #111 339.5deg 349.2deg,
      #b23b3b 349.2deg 360deg);
  }
  .wheel-hub { position: absolute; top: 50%; left: 50%; width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #ddd 40%, #999); transform: translate(-50%,-50%); display: flex; align-items: center; justify-content: center; font-weight: 700; font-family: 'Space Grotesk'; color: #222; font-size: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
  .wheel-spin { animation: wheelspin 1.1s cubic-bezier(.2,.7,.3,1); }
  @keyframes wheelspin { from { transform: rotate(0deg); } to { transform: rotate(1080deg); } }
  .ball { position: absolute; top: 6px; left: 50%; width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #fff, #ccc); transform: translateX(-50%); box-shadow: 0 0 6px rgba(255,255,255,0.7); }

  .table-felt-card { background: radial-gradient(ellipse at 50% -10%, #1a3324 0%, #0d1b12 75%); border: 1px solid rgba(72,219,141,0.25); border-radius: 14px; padding: 16px; }
  .playing-card { position: relative; display: inline-block; width: 46px; height: 64px; border-radius: 8px; margin-right: 8px; background: linear-gradient(160deg, #fdfdfd, #e8e8e8); color: #222; animation: deal 0.35s ease; box-shadow: 0 3px 8px rgba(0,0,0,0.4); font-family: 'Space Grotesk'; vertical-align: top; }
  .playing-card.red { color: #c62828; }
  .playing-card .corner { position: absolute; top: 4px; left: 5px; font-size: 12px; font-weight: 700; line-height: 1; }
  .playing-card .corner-suit { font-size: 10px; }
  .playing-card .center-suit { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 22px; }
  .playing-card.facedown { background: repeating-linear-gradient(45deg, #1a3324, #1a3324 4px, #143c26 4px, #143c26 8px); border: 1px solid rgba(72,219,141,0.3); }
  @keyframes deal { from { opacity: 0; transform: translateY(-14px) rotate(-10deg); } to { opacity: 1; transform: translateY(0) rotate(0); } }

  .tabbtn { flex: 1; text-align: center; }
  .tabbtn.active { border-color: #48db8d; background: rgba(72,219,141,0.18); box-shadow: 0 0 16px rgba(72,219,141,0.25); }

  .leaderboard-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06); animation: fadeIn 0.3s ease; }
  .rank { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,0.08); font-size: 12px; margin-right: 8px; font-weight: 700; }
  .rank-1 { background: rgba(245,197,66,0.25); color: #f5c542; }
  .rank-2 { background: rgba(200,200,200,0.2); color: #ddd; }
  .rank-3 { background: rgba(205,127,50,0.25); color: #cd7f32; }

  .spinner { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #48db8d; border-radius: 50%; width: 18px; height: 18px; animation: rotate 0.8s linear infinite; display: inline-block; }
  @keyframes rotate { to { transform: rotate(360deg); } }

  .live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #f87171; margin-right: 5px; animation: livePulse 1.2s infinite; }
  @keyframes livePulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  .odds-btn { background: rgba(72,219,141,0.1); border: 1px solid rgba(72,219,141,0.35); color: #a7f3c5; font-family: 'Space Grotesk'; }
  .odds-btn:hover { background: rgba(72,219,141,0.25); }

  .sport-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .sport-chip { font-size: 12px; font-weight: 700; font-family: 'Space Grotesk'; padding: 4px 10px; border-radius: 999px; letter-spacing: 0.4px; }
  .sport-nfl { background: rgba(139,92,246,0.18); color: #c4b5fd; border: 1px solid rgba(139,92,246,0.4); }
  .sport-nba { background: rgba(249,115,22,0.18); color: #fdba74; border: 1px solid rgba(249,115,22,0.4); }
  .sport-nhl { background: rgba(56,189,248,0.18); color: #7dd3fc; border: 1px solid rgba(56,189,248,0.4); }
  .sport-mlb { background: rgba(239,68,68,0.18); color: #fca5a5; border: 1px solid rgba(239,68,68,0.4); }
  .sport-wnba { background: rgba(236,72,153,0.18); color: #f9a8d4; border: 1px solid rgba(236,72,153,0.4); }
  .sport-epl { background: rgba(34,197,94,0.18); color: #86efac; border: 1px solid rgba(34,197,94,0.4); }
  .sport-afl { background: rgba(250,204,21,0.18); color: #fde047; border: 1px solid rgba(250,204,21,0.4); }
  .sport-mma { background: rgba(248,113,113,0.18); color: #fca5a5; border: 1px solid rgba(248,113,113,0.4); }

  .game-card { position: relative; padding-left: 20px; overflow: hidden; }
  .game-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
  .accent-nfl::before { background: #8b5cf6; } .accent-nba::before { background: #f97316; }
  .accent-nhl::before { background: #38bdf8; } .accent-mlb::before { background: #ef4444; }
  .accent-wnba::before { background: #ec4899; } .accent-epl::before { background: #22c55e; }
  .accent-afl::before { background: #facc15; } .accent-mma::before { background: #f87171; }

  .matchup-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; }
  .team-name { font-family: 'Space Grotesk'; font-weight: 600; font-size: 15px; }
  .vs-divider { text-align: center; color: #556; font-size: 11px; font-weight: 700; letter-spacing: 1px; padding: 2px 0; }
  .odds-pill { min-width: 58px; text-align: center; font-weight: 700; border-radius: 999px; padding: 8px 14px; }

  .confetti-piece { position: fixed; top: -10px; width: 8px; height: 14px; opacity: 0.9; z-index: 999; animation: confettiFall linear forwards; }
  @keyframes confettiFall { to { transform: translateY(110vh) rotate(540deg); opacity: 0; } }

  ::selection { background: rgba(72,219,141,0.3); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCEE1JDDEMjaHAngIaL5HKkGYWKW9v33Qw",
    authDomain: "family-gambling.firebaseapp.com",
    projectId: "family-gambling",
    storageBucket: "family-gambling.firebasestorage.app",
    messagingSenderId: "128698094488",
    appId: "1:128698094488:web:4054579ec11e0d962891ed"
  };
  firebase.initializeApp(firebaseConfig);
  window.__db = firebase.firestore();

  window.__confetti = function(count) {
    const colors = ['#48db8d', '#f5c542', '#4ade80', '#ffffff'];
    for (let i = 0; i < (count || 40); i++) {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.left = Math.random() * 100 + 'vw';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.animationDuration = (1.6 + Math.random() * 1.2) + 's';
      el.style.transform = `rotate(${Math.random()*360}deg)`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3200);
    }
  };
</script>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;
const db = window.__db;

const START_BALANCE = 1000;
const SPORTS = [
  { key: 'nfl', label: 'NFL' }, { key: 'nba', label: 'NBA' },
  { key: 'nhl', label: 'NHL' }, { key: 'mlb', label: 'MLB' },
  { key: 'wnba', label: 'WNBA' }, { key: 'epl', label: 'Soccer (EPL)' },
  { key: 'afl', label: 'AFL' }, { key: 'mma', label: 'MMA' },
];
const ESPN_MAP = { nfl: 'football/nfl', nba: 'basketball/nba', nhl: 'hockey/nhl', mlb: 'baseball/mlb', wnba: 'basketball/wnba', epl: 'soccer/eng.1', afl: 'australian-football/afl', mma: 'mma/ufc' };
const ROULETTE_ORDER = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
const RED_NUMS = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
const IDLE_RATE_PER_MIN = 25;

function loadLocal(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
}
function saveLocal(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}

function Card({ children, className, style }) { return <div className={'card ' + (className||'')} style={style}>{children}</div>; }
function Btn(props) { return <button {...props}>{props.children}</button>; }

function App() {
  const [name, setName] = useState(() => loadLocal('sb_name', ''));
  const [joined, setJoined] = useState(() => !!loadLocal('sb_name', ''));
  const [tab, setTab] = useState('sports');
  const [player, setPlayer] = useState(null);
  const [games, setGames] = useState({});
  const [gameError, setGameError] = useState('');
  const [betAmt, setBetAmt] = useState(50);
  const [msg, setMsg] = useState('');
  const [bjHand, setBjHand] = useState(null);
  const [board, setBoard] = useState({});
  const [pulse, setPulse] = useState(null);
  const [coinAnim, setCoinAnim] = useState(false);
  const [coinFace, setCoinFace] = useState('?');
  const [reelAnim, setReelAnim] = useState(false);
  const [reels, setReels] = useState(['🍒','🍋','🔔']);
  const [wheelAnim, setWheelAnim] = useState(false);
  const [wheelNum, setWheelNum] = useState(null);
  const [syncing, setSyncing] = useState(false);

  useEffect(() => {
    if (!joined || !name) return;
    const ref = db.collection('players').doc(name);
    let caughtUp = false;
    const unsub = ref.onSnapshot(snap => {
      if (snap.exists) {
        const data = snap.data();
        if (!caughtUp) {
          caughtUp = true;
          const now = Date.now();
          const last = data.lastCollected || now;
          const mins = Math.floor((now - last) / 60000);
          if (mins > 0) {
            const updated = { ...data, balance: data.balance + mins * IDLE_RATE_PER_MIN, lastCollected: last + mins * 60000 };
            ref.set(updated);
            setPlayer(updated);
            return;
          }
        }
        setPlayer(data);
      } else {
        const p = { balance: START_BALANCE, bets: [], history: [], lastCollected: Date.now() };
        ref.set(p); setPlayer(p);
      }
    }, err => { setPlayer(loadLocal(`sb_player_${name}`, { balance: START_BALANCE, bets: [], history: [], lastCollected: Date.now() })); });
    return () => unsub();
  }, [joined, name]);

  // passive income while the app is open
  useEffect(() => {
    if (!joined || !name) return;
    const interval = setInterval(() => {
      setPlayer(p => {
        if (!p) return p;
        const now = Date.now();
        const updated = { ...p, balance: p.balance + IDLE_RATE_PER_MIN, lastCollected: now };
        saveLocal(`sb_player_${name}`, updated);
        db.collection('players').doc(name).set(updated).catch(()=>{});
        return updated;
      });
    }, 60000);
    return () => clearInterval(interval);
  }, [joined, name]);

  useEffect(() => {
    const unsub = db.collection('players').onSnapshot(snap => {
      const b = {}; snap.forEach(doc => { b[doc.id] = doc.data().balance; }); setBoard(b);
    }, err => {});
    return () => unsub();
  }, []);

  const savePlayer = useCallback((p) => {
    setPlayer(p);
    saveLocal(`sb_player_${name}`, p);
    if (name) { setSyncing(true); db.collection('players').doc(name).set(p).finally(() => setSyncing(false)); }
  }, [name]);

  const fetchGames = useCallback(async (sportKey) => {
    try {
      const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${ESPN_MAP[sportKey]}/scoreboard`);
      const data = await res.json();
      return (data.events || []).map(ev => {
        const comp = ev.competitions[0];
        const teams = comp.competitors.map(c => ({
          name: c.team.shortDisplayName || c.team.displayName,
          winner: c.winner, score: c.score, id: c.id,
          record: (c.records && c.records[0] && c.records[0].summary) || '0-0'
        }));
        return { id: ev.id, name: ev.name, status: comp.status.type.state, completed: comp.status.type.completed, teams, date: ev.date };
      });
    } catch (e) { setGameError('Could not load live games right now.'); return []; }
  }, []);

  useEffect(() => {
    if (tab === 'sports') {
      setGameError('');
      Promise.all(SPORTS.map(s => fetchGames(s.key))).then(results => {
        const g = {}; SPORTS.forEach((s, i) => { g[s.key] = results[i]; }); setGames(g);
      });
    }
  }, [tab]);

  useEffect(() => {
    if (!player || !player.bets || player.bets.length === 0) return;
    const allGames = Object.values(games).flat();
    if (allGames.length === 0) return;
    let changed = false;
    let newBalance = player.balance;
    const newHistory = [...player.history];
    const remaining = [];
    let anyWin = false;
    for (const bet of player.bets) {
      const g = allGames.find(g => g.id === bet.gameId);
      if (g && g.completed) {
        changed = true;
        const winnerTeam = g.teams.find(t => t.winner);
        const won = winnerTeam && winnerTeam.name === bet.teamName;
        if (won) {
          const payout = Math.round(bet.amount * bet.odds);
          newBalance += payout; anyWin = true;
          newHistory.unshift({ text: `Won $${payout} on ${bet.teamName} (${g.name})`, win: true });
        } else {
          newHistory.unshift({ text: `Lost $${bet.amount} on ${bet.teamName} (${g.name})`, win: false });
        }
      } else { remaining.push(bet); }
    }
    if (changed) {
      savePlayer({ ...player, balance: newBalance, bets: remaining, history: newHistory.slice(0, 30) });
      triggerPulse(anyWin);
      if (anyWin) window.__confetti(60);
    }
  }, [games]);

  const triggerPulse = (isWin) => { setPulse(isWin ? 'win' : 'loss'); setTimeout(() => setPulse(null), 700); };

  const oddsFor = (team, opp) => {
    const parseRec = (r) => { const [w, l] = (r || '0-0').split('-').map(Number); return (w + 1) / (w + l + 2); };
    const pTeam = parseRec(team.record), pOpp = parseRec(opp.record);
    const winProb = Math.min(0.85, Math.max(0.15, pTeam / (pTeam + pOpp)));
    return Math.max(1.1, +(1 / winProb * 0.95).toFixed(2));
  };

  const placeBet = (game, teamName, odds) => {
    if (!player || betAmt <= 0 || betAmt > player.balance) { setMsg('Invalid bet amount.'); return; }
    const bet = { gameId: game.id, teamName, amount: betAmt, odds, placedAt: Date.now() };
    savePlayer({ ...player, balance: player.balance - betAmt, bets: [...player.bets, bet] });
    setMsg(`Bet placed: $${betAmt} on ${teamName} @ ${odds}x`);
  };

  const applyResult = (delta, label) => {
    if (!player) return;
    const newBalance = Math.max(0, player.balance + delta);
    savePlayer({ ...player, balance: newBalance, history: [{ text: label, win: delta > 0 }, ...player.history].slice(0, 30) });
    triggerPulse(delta > 0);
    if (delta >= betAmt * 3) window.__confetti(70);
  };

  const playCoinFlip = (choice) => {
    if (!player || betAmt <= 0 || betAmt > player.balance) { setMsg('Invalid bet amount.'); return; }
    setCoinAnim(true);
    setTimeout(() => {
      const result = Math.random() < 0.5 ? 'heads' : 'tails';
      setCoinFace(result === 'heads' ? 'H' : 'T'); setCoinAnim(false);
      const win = result === choice;
      applyResult(win ? betAmt : -betAmt, `Coin flip: called ${choice}, landed ${result} — ${win ? 'won' : 'lost'} $${betAmt}`);
      setMsg(`It's ${result}! You ${win ? 'won' : 'lost'} $${betAmt}.`);
    }, 800);
  };

  const playSlots = () => {
    if (!player || betAmt <= 0 || betAmt > player.balance) { setMsg('Invalid bet amount.'); return; }
    setReelAnim(true);
    setLeverPull(true);
    setTimeout(() => setLeverPull(false), 500);
    setTimeout(() => {
      const symbols = ['🍒','🍋','🔔','⭐','7️⃣'];
      const newReels = [0,1,2].map(() => symbols[Math.floor(Math.random() * symbols.length)]);
      setReels(newReels); setReelAnim(false);
      let mult = 0;
      if (newReels[0] === newReels[1] && newReels[1] === newReels[2]) mult = newReels[0] === '7️⃣' ? 10 : 5;
      else if (newReels[0] === newReels[1] || newReels[1] === newReels[2] || newReels[0] === newReels[2]) mult = 1.5;
      const delta = mult > 0 ? Math.round(betAmt * mult) - betAmt : -betAmt;
      applyResult(delta, `Slots: ${newReels.join(' ')} — ${delta >= 0 ? 'won' : 'lost'} $${Math.abs(delta)}`);
      setMsg(`${newReels.join(' ')}  ${delta >= 0 ? `Won $${delta}!` : `Lost $${betAmt}.`}`);
    }, 550);
  };

  const playRoulette = (pick) => {
    if (!player || betAmt <= 0 || betAmt > player.balance) { setMsg('Invalid bet amount.'); return; }
    setWheelAnim(true);
    setTimeout(() => {
      const n = Math.floor(Math.random() * 37);
      setWheelNum(n); setWheelAnim(false);
      const isRed = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36].includes(n);
      const color = n === 0 ? 'green' : isRed ? 'red' : 'black';
      let win = false, mult = 0;
      if (pick === 'red' || pick === 'black') { win = pick === color; mult = 2; }
      else if (pick === 'even' || pick === 'odd') { win = n !== 0 && (n % 2 === 0) === (pick === 'even'); mult = 2; }
      const delta = win ? betAmt * (mult - 1) : -betAmt;
      applyResult(delta, `Roulette: landed ${n} (${color}), bet ${pick} — ${win ? 'won' : 'lost'} $${Math.abs(delta)}`);
      setMsg(`Ball landed on ${n} (${color}). You ${win ? `won $${delta}` : `lost $${betAmt}`}.`);
    }, 1000);
  };

  const draw = () => {
    const n = Math.min(10, Math.floor(Math.random() * 13) + 1);
    const suits = ['♠','♥','♦','♣'];
    const suit = suits[Math.floor(Math.random() * 4)];
    const label = n === 1 ? 'A' : n;
    return { n, label, suit, red: suit === '♥' || suit === '♦' };
  };
  const handVal = (cards) => cards.reduce((a,b)=>a+b.n, 0);
  const [leverPull, setLeverPull] = useState(false);
  const startBlackjack = () => {
    if (!player || betAmt <= 0 || betAmt > player.balance) { setMsg('Invalid bet amount.'); return; }
    savePlayer({ ...player, balance: player.balance - betAmt });
    setBjHand({ player: [draw(), draw()], dealer: [draw(), draw()], done: false });
  };
  const bjHit = () => setBjHand(h => ({ ...h, player: [...h.player, draw()] }));
  const bjStand = () => {
    setBjHand(h => {
      if (!h) return h;
      let dealer = [...h.dealer];
      while (handVal(dealer) < 17) dealer.push(draw());
      const pv = handVal(h.player), dv = handVal(dealer);
      let outcome, delta;
      if (pv > 21) { outcome = 'You bust'; delta = -betAmt; }
      else if (dv > 21 || pv > dv) { outcome = 'You win'; delta = betAmt; }
      else if (pv === dv) { outcome = 'Push'; delta = 0; }
      else { outcome = 'Dealer wins'; delta = -betAmt; }
      applyResult(delta + betAmt, `Blackjack: ${outcome} (you ${pv}, dealer ${dv}) — net $${delta}`);
      return { ...h, dealer, done: true, outcome, delta };
    });
  };
  useEffect(() => { if (bjHand && !bjHand.done && handVal(bjHand.player) > 21) bjStand(); }, [bjHand]);

  const joinNow = () => { if (!name.trim()) return; saveLocal('sb_name', name); setJoined(true); };

  if (!joined) {
    return (
      <div className="wrap" style={{ marginTop: 60 }}>
        <div className="hero">
          <h1 style={{ fontSize: 28 }}>🎰 Family <span className="gold">Sportsbook</span></h1>
          <p className="muted">Enter your name to join with <span className="gold" style={{ fontWeight: 700 }}>${START_BALANCE}</span> in play money.</p>
          <input placeholder="Your name" value={name} onChange={e => setName(e.target.value)} style={{ width: '100%', marginBottom: 12, marginTop: 10 }} onKeyDown={e => e.key === 'Enter' && joinNow()} />
          <Btn onClick={joinNow} style={{ width: '100%' }}>Join the game</Btn>
        </div>
      </div>
    );
  }

  if (!player) return <div className="wrap" style={{ paddingTop: 40 }}><span className="spinner"></span> Loading...</div>;

  return (
    <div className="wrap">
      <div className="hero">
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <div>
            <div className="muted">{name} {syncing && <span className="spinner" style={{ marginLeft: 6 }}></span>}</div>
            <div className={'balance' + (pulse === 'win' ? ' pulse-win' : pulse === 'loss' ? ' pulse-loss' : '')} style={{ fontSize: 30, fontWeight: 700 }}>${player.balance.toLocaleString()}</div>
          </div>
          <div style={{ textAlign: 'right' }}>
            <div className="muted">Bet amount</div>
            <input type="number" value={betAmt} min={1} onChange={e => setBetAmt(Math.max(1, +e.target.value))} style={{ width: 90 }} />
          </div>
        </div>
      </div>
      <div className="hero-spacer"></div>

      <div style={{ display: 'flex', gap: 8, marginBottom: 14 }}>
        {['sports','casino','board','history'].map(t => (
          <Btn key={t} className={'tabbtn' + (tab === t ? ' active' : '')} onClick={() => setTab(t)}>
            {t === 'sports' ? '🏈 Sports' : t === 'casino' ? '🎲 Casino' : t === 'board' ? '🏆 Board' : '📜 History'}
          </Btn>
        ))}
      </div>

      {msg && <Card style={{ borderColor: 'rgba(245,197,66,0.3)' }}>{msg}</Card>}

      {tab === 'sports' && (
        <div className="tab-panel">
          {gameError && <Card>{gameError}</Card>}
          {SPORTS.map(s => (
            <div key={s.key} style={{ marginBottom: 22 }}>
              <div className="sport-header">
                <span className={'sport-chip sport-' + s.key}>{s.label}</span>
              </div>
              {(games[s.key] || []).length === 0 && <p className="muted">No games right now.</p>}
              {(games[s.key] || []).filter(g => !g.completed).slice(0, 6).map(g => (
                <Card key={g.id} className={'game-card accent-' + s.key}>
                  <div className="muted" style={{ marginBottom: 10, fontSize: 12 }}>{g.status === 'in' ? <><span className="live-dot"></span>LIVE</> : new Date(g.date).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' })}</div>
                  {g.teams.map((t, i) => {
                    const opp = g.teams[1 - i];
                    const odds = oddsFor(t, opp);
                    return (
                      <React.Fragment key={t.id}>
                        <div className="matchup-row">
                          <div>
                            <div className="team-name">{t.name}</div>
                            <div className="muted" style={{ fontSize: 12 }}>{t.record}</div>
                          </div>
                          <Btn className={'odds-btn odds-pill sport-' + s.key} onClick={() => placeBet(g, t.name, odds)}>{odds}x</Btn>
                        </div>
                        {i === 0 && <div className="vs-divider">VS</div>}
                      </React.Fragment>
                    );
                  })}
                </Card>
              ))}
            </div>
          ))}
        </div>
      )}

      {tab === 'casino' && (
        <div className="tab-panel">
          <Card className="felt">
            <h3>Coin flip</h3>
            <div className={'coin' + (coinAnim ? ' coin-flip' : '')}>{coinAnim ? '' : coinFace}</div>
            <div style={{ display: 'flex', gap: 8, justifyContent: 'center' }}>
              <Btn disabled={coinAnim} onClick={() => playCoinFlip('heads')}>Heads</Btn>
              <Btn disabled={coinAnim} onClick={() => playCoinFlip('tails')}>Tails</Btn>
            </div>
          </Card>
          <Card className="felt">
            <h3>Slots</h3>
            <div className="slot-machine">
              <div className="slot-window">
                {reels.map((r, i) => <span key={i} className={'reel' + (reelAnim ? ' reel-spin' : '')}>{r}</span>)}
              </div>
              <div className={'lever' + (leverPull ? ' lever-pull' : '')}></div>
            </div>
            <div style={{ textAlign: 'center', marginTop: 14 }}><Btn disabled={reelAnim} onClick={playSlots}>Pull lever</Btn></div>
          </Card>
          <Card className="felt">
            <h3>Roulette</h3>
            <div className="wheel-wrap">
              <div className={'wheel' + (wheelAnim ? ' wheel-spin' : '')}>
                {ROULETTE_ORDER.map((num, i) => {
                  const angle = (360 / ROULETTE_ORDER.length) * i;
                  const isRed = RED_NUMS.includes(num);
                  const color = num === 0 ? '#4ade80' : isRed ? '#f5b5b5' : '#ddd';
                  return (
                    <div key={num} style={{ position: 'absolute', top: '50%', left: '50%', width: 0, height: 0, transform: `rotate(${angle}deg) translate(0, -58px)` }}>
                      <span style={{ display: 'inline-block', transform: `rotate(${-angle}deg) translate(-50%, -50%)`, fontSize: 9, fontWeight: 700, color, fontFamily: 'Space Grotesk' }}>{num}</span>
                    </div>
                  );
                })}
                <div className="wheel-hub">{wheelAnim ? '' : (wheelNum === null ? '?' : wheelNum)}</div>
              </div>
              {!wheelAnim && <div className="ball"></div>}
            </div>
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', justifyContent: 'center' }}>
              <Btn disabled={wheelAnim} onClick={() => playRoulette('red')}>Red</Btn>
              <Btn disabled={wheelAnim} onClick={() => playRoulette('black')}>Black</Btn>
              <Btn disabled={wheelAnim} onClick={() => playRoulette('even')}>Even</Btn>
              <Btn disabled={wheelAnim} onClick={() => playRoulette('odd')}>Odd</Btn>
            </div>
          </Card>
          <Card className="table-felt-card">
            <h3>Blackjack</h3>
            {!bjHand && <Btn onClick={startBlackjack}>Deal</Btn>}
            {bjHand && (
              <div>
                <p className="muted" style={{ marginBottom: 4 }}>You ({handVal(bjHand.player)})</p>
                <p>{bjHand.player.map((c,i) => (
                  <span key={i} className={'playing-card' + (c.red ? ' red' : '')}>
                    <span className="corner">{c.label}<br/><span className="corner-suit">{c.suit}</span></span>
                    <span className="center-suit">{c.suit}</span>
                  </span>
                ))}</p>
                <p className="muted" style={{ marginBottom: 4, marginTop: 12 }}>Dealer {bjHand.done ? `(${handVal(bjHand.dealer)})` : ''}</p>
                <p>{bjHand.done ? bjHand.dealer.map((c,i) => (
                  <span key={i} className={'playing-card' + (c.red ? ' red' : '')}>
                    <span className="corner">{c.label}<br/><span className="corner-suit">{c.suit}</span></span>
                    <span className="center-suit">{c.suit}</span>
                  </span>
                )) : (
                  <>
                    <span className={'playing-card' + (bjHand.dealer[0].red ? ' red' : '')}>
                      <span className="corner">{bjHand.dealer[0].label}<br/><span className="corner-suit">{bjHand.dealer[0].suit}</span></span>
                      <span className="center-suit">{bjHand.dealer[0].suit}</span>
                    </span>
                    <span className="playing-card facedown"></span>
                  </>
                )}</p>
                {!bjHand.done && (
                  <div style={{ display: 'flex', gap: 8, marginTop: 10 }}>
                    <Btn onClick={bjHit}>Hit</Btn>
                    <Btn onClick={bjStand}>Stand</Btn>
                  </div>
                )}
                {bjHand.done && (
                  <>
                    <p style={{ fontWeight: 700, fontFamily: 'Space Grotesk', marginTop: 10 }} className={bjHand.delta > 0 ? 'win' : bjHand.delta < 0 ? 'loss' : 'muted'}>{bjHand.outcome}</p>
                    <Btn onClick={() => setBjHand(null)}>New hand</Btn>
                  </>
                )}
              </div>
            )}
          </Card>
        </div>
      )}

      {tab === 'board' && (
        <Card className="tab-panel">
          <h3>🏆 Leaderboard</h3>
          {Object.entries(board).sort((a,b) => b[1]-a[1]).map(([n, bal], idx) => (
            <div key={n} className="leaderboard-row">
              <span><span className={'rank ' + (idx===0?'rank-1':idx===1?'rank-2':idx===2?'rank-3':'')}>{idx+1}</span>{n}{n === name ? ' (you)' : ''}</span>
              <span style={{ fontFamily: 'Space Grotesk', fontWeight: 600 }}>${bal.toLocaleString()}</span>
            </div>
          ))}
          {Object.keys(board).length === 0 && <p className="muted">No one's joined yet.</p>}
        </Card>
      )}

      {tab === 'history' && (
        <Card className="tab-panel">
          <h3>History</h3>
          {player.history.length === 0 && <p className="muted">No activity yet.</p>}
          {player.history.map((h, i) => (
            <div key={i} className={h.win ? 'win' : 'loss'} style={{ padding: '8px 0', borderBottom: '1px solid rgba(255,255,255,0.06)', fontSize: 14 }}>{h.text}</div>
          ))}
          {player.bets.length > 0 && (
            <>
              <p style={{ marginTop: 14, fontWeight: 600 }}>Pending bets</p>
              {player.bets.map((b, i) => <div key={i} className="muted">${b.amount} on {b.teamName} @ {b.odds}x</div>)}
            </>
          )}
        </Card>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
